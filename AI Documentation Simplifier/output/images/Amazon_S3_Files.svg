  <rect x="463" y="222" width="22" height="34" fill="#C87840" rx="2" />
  <rect x="488" y="220" width="18" height="36" fill="#D4A030" rx="2" />
  <rect x="509" y="221" width="20" height="35" fill="#C87840" rx="2" />

