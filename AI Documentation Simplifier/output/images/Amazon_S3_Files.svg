  <rect x="720" y="123" width="9" height="34" fill="#1B8BDB" rx="1" />

  <!-- Books on shelf 2 row 2 -->
  <rect x="645" y="171" width="14" height="35" fill="#CC4444" rx="1" />
  <rect x="662" y="173" width="10" height="33" fill="#FF9900" rx="1" />
  <rect x="675" y="170" width="13" height="36" fill="#2E8B57" rx="1" />
  <rect x="691" y="172" width="11" height="34" fill="#6B48FF" rx="1" />
  <rect x="705" y="171" width="15" height="35" fill="#1B8BDB" rx="1" />
  <rect x="723" y="173" width="9" height="33" fill="#FF9900" rx="1" />

  <!-- Boxes on shelf 2 rows -->
  <rect x="645" y="220" width="22" height="36" fill="#C87840" rx="2" />
  <rect x="670" y="222" width="18" height="34" fill="#D4A030" rx="2" />
  <rect x="691" y="220" width="24" height="36" fill="#A06830" rx="2" />
  <rect x="718" y="221" width="14" height="35" fill="#C87840" rx="2" />
  <rect x="645" y="270" width="20" height="28" fill="#D4A030" rx="2" />
  <rect x="668" y="272" width="24" height="26" fill="#A06830" rx="2" />
  <rect x="695" y="270" width="18" height="28" fill="#C87840" rx="2" />
  <rect x="716" y="271" width="16" height="27" fill="#D4A030" rx="2" />

  <!-- Warehouse label sign -->
  <rect x="555" y="95" width="90" height="22" fill="#232F3E" rx="4" />
  <rect x="558" y="98" width="84" height="16" fill="#1B8BDB" rx="3" opacity="0.8" />
  <!-- Small decorative lines on sign -->
  <line x1="565" y1="106" x2="595" y2="106" stroke="white" stroke-width="2" opacity="0.7" />
  <line x1="600" y1="106" x2="635" y2="106" stroke="white" stroke-width="2" opacity="0.7" />

  <!-- ===== READING DESK FOREGROUND ===== -->
  <!-- Desk surface -->
  <rect x="60" y="340" width="280" height="55" fill="url(#deskGrad)" rx="6" filter="url(#shadow)" />
  <!-- Desk front panel -->
  <rect x="70" y="390" width="260" height="20" fill="#A07040" rx="4" />
  <!-- Desk legs -->
  <rect x="80" y="408" width="18" height="30" fill="#8B6030" rx="3" />
  <rect x="302" y="408" width="18" height="30" fill="#8B6030" rx="3" />

  <!-- Lamp on desk -->
  <rect x="290" y="300" width="6" height="42" fill="#888" rx="2" />
  <ellipse cx="293" cy="300" rx="18" ry="10" fill="#FFD060" opacity="0.9" />
  <ellipse cx="293" cy="300" rx="18" ry="10" fill="none" stroke="#AA8820" stroke-width="2" />
  <!-- Lamp glow -->
  <ellipse cx="250" cy="345" rx="80" ry="30" fill="#FFE090" opacity="0.25" />

  <!-- Open book on desk -->
  <ellipse cx="190" cy="345" rx="70" ry="12" fill="#F5ECD0" />
  <!-- Book spine -->
  <line x1="190" y1="333" x2="190" y2="357" stroke="#C8A060" stroke-width="2" />
  <!-- Book pages left -->
  <path d="M120,345 Q155,330 190,333 L190,357 Q155,360 120,345 Z" fill="#FFFAF0" stroke="#D4B870" stroke-width="1" />
  <!-- Book pages right -->
  <path d="M260,345 Q225,330 190,333 L190,357 Q225,360 260,345 Z" fill="#FFF8E8" stroke="#D4B870" stroke-width="1" />
  <!-- Text lines on book -->
  <line x1="135" y1="340" x2="182" y2="337" stroke="#C8A060" stroke-width="1" opacity="0.5" />
  <line x1="133" y1="345" x2="182" y2="343" stroke="#C8A060" stroke-width="1" opacity="0.5" />
  <line x1="135" y1="350" x2="182" y2="349" stroke="#C8A060" stroke-width="1" opacity="0.5" />
  <line x1="198" y1="337" x2="245" y2="340" stroke="#C8A060" stroke-width="1" opacity="0.5" />
  <line x1="198" y1="343" x2="247" y2="345" stroke="#C8A060" stroke-width="1" opacity="0.5" />
  <line x1="198" y1="349" x2="245" y2="350" stroke="#C8A060" stroke-width="1" opacity="0.5" />

  <!-- ===== LIBRARIAN CHARACTER ===== -->
  <!-- Librarian body -->
  <!-- Legs -->
  <rect x="355" y="340" width="14" height="55" fill="#4A6080" rx="4" />
  <rect x="375" y="340" width="14" height="55" fill="#4A6080" rx="4" />
  <!-- Shoes -->
  <ellipse cx="362" cy="396" rx="10" ry="5" fill="#232F3E" />
  <ellipse cx="382" cy="396" rx="10" ry="5" fill="#232F3E" />
  <!-- Skirt/body lower -->
  <path d="M348,290 Q360,345 355,345 L395,345 Q390,345 402,290 Z" fill="#6B48FF" />
  <!-- Torso -->
  <rect x="350" y="240" width="52" height="55" fill="#6B48FF" rx="6" />
