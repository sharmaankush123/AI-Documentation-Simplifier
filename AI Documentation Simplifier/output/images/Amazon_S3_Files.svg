<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background warm gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE8C8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A96A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8864E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="warehouseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8D8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0B8CC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C88A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8A060;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B6040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A07848;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000033" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="5" flood-color="#00000022" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Floor -->
  <rect x="0" y="390" width="800" height="110" fill="url(#floorGrad)" rx="0" />
  <!-- Floor shine line -->
  <line x1="0" y1="392" x2="800" y2="392" stroke="#E8C07A" stroke-width="2" opacity="0.6" />

  <!-- ===== WAREHOUSE BACKGROUND ===== -->
  <!-- Warehouse building -->
  <rect x="420" y="80" width="360" height="320" fill="url(#warehouseGrad)" rx="8" filter="url(#shadow)" />
  <!-- Warehouse roof -->
  <polygon points="410,80 790,80 790,65 600,40 410,65" fill="#8899AA" />
  <!-- Warehouse door opening -->
  <rect x="540" y="230" width="80" height="170" fill="#232F3E" rx="4" />
  <!-- Door frame -->
  <rect x="536" y="226" width="88" height="178" fill="none" stroke="#8B6040" stroke-width="4" rx="4" />

  <!-- Warehouse shelves - back row -->
  <!-- Shelf unit 1 -->
  <rect x="435" y="110" width="90" height="200" fill="url(#shelfGrad)" rx="3" />
  <rect x="435" y="110" width="90" height="8" fill="#6B4020" rx="2" />
  <rect x="435" y="160" width="90" height="8" fill="#6B4020" rx="2" />
  <rect x="435" y="210" width="90" height="8" fill="#6B4020" rx="2" />
  <rect x="435" y="260" width="90" height="8" fill="#6B4020" rx="2" />
  <rect x="435" y="302" width="90" height="8" fill="#6B4020" rx="2" />

  <!-- Books/boxes on shelf 1 row 1 -->
  <rect x="440" y="125" width="12" height="32" fill="#FF9900" rx="1" />
