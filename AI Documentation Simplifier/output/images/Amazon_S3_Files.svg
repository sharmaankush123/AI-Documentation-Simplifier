  <rect x="467" y="272" width="20" height="26" fill="#C87840" rx="2" />
  <rect x="490" y="270" width="22" height="28" fill="#A06830" rx="2" />
  <rect x="515" y="271" width="12" height="27" fill="#D4A030" rx="2" />

  <!-- Shelf unit 2 -->
  <rect x="640" y="110" width="90" height="200" fill="url(#shelfGrad)" rx="3" />
  <rect x="640" y="110" width="90" height="8" fill="#6B4020" rx="2" />
  <rect x="640" y="160" width="90" height="8" fill="#6B4020" rx="2" />
  <rect x="640" y="210" width="90" height="8" fill="#6B4020" rx="2" />
  <rect x="640" y="260" width="90" height="8" fill="#6B4020" rx="2" />
  <rect x="640" y="302" width="90" height="8" fill="#6B4020" rx="2" />

  <!-- Books on shelf 2 row 1 -->
  <rect x="645" y="123" width="11" height="34" fill="#1B8BDB" rx="1" />
  <rect x="659" y="125" width="13" height="32" fill="#6B48FF" rx="1" />
  <rect x="675" y="122" width="10" height="35" fill="#FF9900" rx="1" />
