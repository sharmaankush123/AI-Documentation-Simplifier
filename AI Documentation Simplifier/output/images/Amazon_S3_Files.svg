  <rect x="472" y="174" width="13" height="32" fill="#1B8BDB" rx="1" />
  <rect x="488" y="171" width="10" height="35" fill="#6B48FF" rx="1" />
  <rect x="501" y="173" width="14" height="33" fill="#CC4444" rx="1" />
  <rect x="518" y="172" width="9" height="34" fill="#2E8B57" rx="1" />

